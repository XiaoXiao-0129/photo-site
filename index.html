<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Gallery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #121212; 
            color: #e0e0e0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        h1 { font-weight: 300; letter-spacing: 2px; margin-bottom: 8px; font-size: 1.8rem; }
        p.subtitle { color: #888; font-size: 0.9rem; margin-bottom: 40px; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }
        .card {
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 260px; object-fit: cover; display: block; }
        .card .info { padding: 15px; }
        .card .title { font-size: 1rem; color: #fff; margin-bottom: 4px; }
        .card .meta { font-size: 0.8rem; color: #666; }
    </style>
</head>
<body>
    <h1>LENS & LIGHT</h1>
    <p class="subtitle">日常记录 / 随手拍</p>

    <div class="gallery">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800" alt="睡莲">
            <div class="info">
                <div class="title">睡莲与高光</div>
                <div class="meta">2026.06 · 上海</div>
            </div>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=800" alt="树影">
            <div class="info">
                <div class="title">林间逆光</div>
                <div class="meta">2026.07 · 公园</div>
            </div>
        </div>
    </div>
</body>
</html>
